# Reference copy of the edge rules in the LIVE OpenLiteSpeed vhost (/usr/local/lsws/conf/vhosts/nigma/vhconf.conf),
# inside the `rewrite { rules <<<END_rules ... }` block, before the WordPress front-controller rules.
# The server vhost config is NOT deployed from git: after changing this file, apply it on the server and restart OpenLiteSpeed.
# Before changing a pattern, test it against every real URL (wp post list / term links) - see ADR-015.

# ---- Edge rules for the nigma OpenLiteSpeed vhost (inside `rewrite { rules <<<END_rules ... }`) ----
# Spam doorway / probe URLs: answer 410 Gone before PHP runs. Tested against every real URL (0 false positives).
RewriteRule ^/?(?:[a-z0-9]+/){1,4}(?=[a-z0-9]{15,}(?:/|$))(?:[a-z]*[0-9]){4}[a-z0-9]*(?:/[^?]*)?$ - [G,L]
RewriteRule ^/?[a-z]+(?:/[a-z]+)?/[0-9]{9,}/?$ - [G,L]
RewriteRule ^/?sitemap[-_]?[a-z]*[-_]?[0-9]+\.xml$ - [G,L]
RewriteCond %{QUERY_STRING} ^sitemap[0-9a-z_-]*\.xml
RewriteRule .* - [G,L]
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^/?(?!(?:index|wp-login|wp-cron|wp-comments-post|wp-trackback|wp-signup|wp-activate|wp-mail|wp-links-opml|wp-load|wp-blog-header|wp-settings|xmlrpc)\.php$)[^/]+\.php$ - [G,L]
# Canonical host: nigma.ae -> https://www.nigma.ae (one hop; certificate challenges excluded)
RewriteCond %{HTTP_HOST} ^nigma\.ae$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^/?(.*)$ https://www.nigma.ae/$1 [R=301,L,NE]
