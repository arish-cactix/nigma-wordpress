name: Deploy to Production

# Deploys are PULL-based: the production server runs nigma-deploy.timer, which
# fetches origin/main every minute, deploys it, health-checks it (auto-rolling
# back on failure) and publishes the deployed commit at /deploy-version.txt.
# This workflow therefore needs no SSH access or cloud credentials: it waits
# until the live site reports this commit, then runs a health check.
# See docs/deployment.md and ADR-014.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Wait for server deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (history needed to compare commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until the live site runs this commit
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "Waiting for production to deploy $SHA ..."
          deadline=$((SECONDS + 600))
          live=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            live=$(curl -fsS --max-time 15 "https://www.nigma.ae/deploy-version.txt?cb=${RANDOM}${RANDOM}" 2>/dev/null | head -1 | tr -d '[:space:]' || true)
            if [ "$live" = "$SHA" ]; then
              echo "Production is running $SHA."
              exit 0
            fi
            # A later push may already have been deployed; that also contains this commit.
            if [ -n "$live" ] && git cat-file -e "${live}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$SHA" "$live"; then
              echo "Production is already on a newer commit ($live) that includes $SHA."
              exit 0
            fi
            echo "live=${live:-unknown} want=$SHA — waiting..."
            sleep 15
          done
          echo "::error::Production did not reach $SHA within 10 minutes. The server auto-rolls back a failed deploy; check /var/log/nigma-deploy.log (via SSM)."
          exit 1

      - name: Health check
        run: |
          echo "Checking https://www.nigma.ae/ ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://www.nigma.ae/)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check FAILED — site returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed."

      - name: Send notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL_FROM }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: NIGMA Deployments <${{ secrets.NOTIFY_EMAIL_FROM }}>
          subject: "${{ job.status == 'success' && '✅' || '❌' }} [NIGMA] Deploy ${{ job.status }} — ${{ github.sha }}"
          body: |
            Status:   ${{ job.status }}
            Commit:   ${{ github.sha }}
            Message:  ${{ github.event.head_commit.message }}
            Author:   ${{ github.actor }}

            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
