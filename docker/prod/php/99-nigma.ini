; NIGMA PHP overrides for the Docker web container (ADR-016).
; Mounted into lsphp83's scan directory; loaded after the image defaults, so these win.
; Mirrors the native server's hardening (ADR-014).

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_vars = 3000

expose_php = Off
display_errors = Off
log_errors = On
allow_url_include = Off

; Block the functions web shells rely on. WP-CLI runs in its own container, unaffected.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,dl

session.cookie_httponly = 1

opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
